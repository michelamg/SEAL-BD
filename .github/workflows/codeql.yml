name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze
    # CodeQL code scanning requires GitHub Advanced Security, which is not
    # available on a private repo without a paid GHAS license (free only on public
    # repos). Gated off by default so it doesn't fail every run; set the repo
    # variable ENABLE_CODEQL=true once this lands on a repo/org with GHAS (e.g.
    # C&W's). Until then security is covered by typecheck/lint/test, gitleaks, and
    # Dependabot.
    if: ${{ vars.ENABLE_CODEQL == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
