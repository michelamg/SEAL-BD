name: Secret Scan

on:
  push:
  pull_request:

jobs:
  gitleaks:
    name: Gitleaks
    # Dependabot PRs run with a read-only token + no secrets access, which makes
    # the action fail; skip them (pushes to main are still scanned).
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
